<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>For You 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    .box {
      background: rgba(0,0,0,0.3);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.9;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #ff6b81;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffe6ea;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>haloo sayanggg 💕</h1>
  <p>pencet tombol di bawah ya...</p>
  <button onclick="playMusic()">Play 🎵</button>
</div>

<audio id="bgm" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('bgm');

function playMusic() {
  audio.currentTime = 68; // mulai dari reff
  audio.volume = 0;
  audio.play();

  let vol = 0;
  const fade = setInterval(() => {
    if (vol < 1) {
      vol += 0.05;
      audio.volume = vol;
    } else {
      clearInterval(fade);
    }
  }, 200);
}
</script>

</body>
</html>
